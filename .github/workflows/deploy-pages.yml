name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["KIS Daily Market Update", "Telegram Research Update", "Hana Exchange Rate Update"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Assemble static site
        shell: bash
        run: |
          mkdir -p _site/data
          cp -R web/. _site/
          find data -maxdepth 1 -type f -name '*.json' -exec cp {} _site/data/ \;
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/app.js
          test -f _site/styles.css
          test -f _site/data/market_latest.json
          test -f _site/data/exchange_latest.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
