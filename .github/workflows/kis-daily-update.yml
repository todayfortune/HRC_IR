name: KIS Daily Market Update

on:
  workflow_dispatch:
    inputs:
      refresh_market:
        description: "Run the KIS market refresh (false = tests only)"
        required: true
        type: boolean
        default: false
      allow_initial_token:
        description: "Permit one tokenP issuance when no valid cached token exists (06:00 KST only)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: kis-daily-market-update
  cancel-in-progress: false

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Restore encrypted KIS token
        if: inputs.refresh_market == true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kis-private/token.enc
          key: kis-private-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: kis-private-v1-
          fail-on-cache-miss: false

      - name: Prepare daily KIS token
        id: token
        if: inputs.refresh_market == true
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_TOKEN_CACHE_PATH: ${{ runner.temp }}/kis-private/token.enc
          KIS_ALLOW_INITIAL_TOKEN: ${{ inputs.allow_initial_token == true && github.run_attempt == 1 && 'true' || 'false' }}
        run: python scripts/prepare_kis_token.py

      # Save even after failed issuance so a rerun cannot retry tokenP that day.
      - name: Persist encrypted KIS token before querying
        if: always() && inputs.refresh_market == true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/kis-private/token.enc
          key: kis-private-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Refresh KIS market data
        if: inputs.refresh_market == true
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_TOKEN_CACHE_PATH: ${{ runner.temp }}/kis-private/token.enc
        run: python scripts/update_market.py

      - name: Commit refreshed public data
        if: inputs.refresh_market == true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/market_latest.json
          if git diff --cached --quiet; then
            echo "No market data changes to commit."
          else
            git commit -m "chore: refresh KIS market data"
            if ! git diff --quiet; then
              echo "Unexpected tracked changes remain after market commit."
              git status --short
              exit 1
            fi
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 5))
            done
            exit 1
          fi
