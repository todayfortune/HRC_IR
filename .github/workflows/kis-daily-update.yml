name: KIS Daily Market Update

on:
  schedule:
    # GitHub cron is UTC: 21:00 UTC = 06:00 KST on the following day.
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      refresh_market:
        description: "Issue a KIS token and refresh market data (off = tests only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: kis-daily-market-update
  cancel-in-progress: false

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Refresh KIS market data
        if: github.event_name == 'schedule' || inputs.refresh_market == true
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python scripts/update_market.py

      - name: Commit refreshed public data
        if: github.event_name == 'schedule' || inputs.refresh_market == true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/market_latest.json
          if git diff --cached --quiet; then
            echo "No market data changes to commit."
          else
            git commit -m "chore: refresh KIS market data"
            git push
          fi
